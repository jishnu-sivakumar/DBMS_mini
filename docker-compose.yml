version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: propfind-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: propfind_db
    ports:
      - "5432:5432"
    volumes:
      - propfind_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  propfind_pgdata:
