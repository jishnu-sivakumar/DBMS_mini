services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: propfind-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-propfind_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - propfind_pgdata:/var/lib/postgresql/data

volumes:
  propfind_pgdata:
